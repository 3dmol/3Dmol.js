<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3Dmol.js TypeScript UI demo</title>
  <style>
    body { margin: 0; background: #eef2f4; color: #172d39; font: 15px system-ui, sans-serif; }
    main { max-width: 1400px; margin: auto; padding: 16px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    .demo-viewer { position: relative; width: 100%; height: 680px; border: 1px solid #dbe4e6; border-radius: 16px; overflow: hidden; }
    #trajectory { height: 440px; }
    @media (max-width: 600px) { main { padding: 8px; } .demo-viewer { height: 620px; } }
  </style>
  <script src="../../build/3Dmol.js"></script>
  <script src="../../build/3Dmol.ui.js"></script>
</head>
<body>
<main>
  <h1>Molecule explorer</h1>
  <p>Explore a protein, load your own structures, and use guided selections to change their appearance.</p>
  <div id="protein" class="demo-viewer viewer_3Dmoljs" data-ui="true" data-href="../test_structs/1YCR.pdb"
    data-backgroundcolor="#edf2f4" data-style="cartoon:color=spectrum"
    data-select1="chain:B" data-style1="stick:colorscheme=greenCarbon"></div>
  <h2>Trajectory controls</h2>
  <p>A small synthetic trajectory for testing playback. This viewer has its own controls.</p>
  <div id="trajectory" class="demo-viewer"></div>
</main>
<script>
  const trajectoryViewer = $3Dmol.createViewer('trajectory', { backgroundColor: '#edf2f4' });
  let frames = '';
  for (let i = 0; i < 40; i++) {
    const y = Math.sin(i / 40 * Math.PI * 2) * 0.35;
    frames += `3\nFrame ${i + 1}\nO 0 0 0\nH 0.76 ${0.58 + y} 0\nH -0.76 ${0.58 - y} 0\n`;
  }
  trajectoryViewer.addModelsAsFrames(frames, 'xyz');
  trajectoryViewer.setStyle({}, { stick: { radius: 0.12 }, sphere: { scale: 0.28 } });
  trajectoryViewer.zoomTo(); trajectoryViewer.render();
  const trajectoryControls = new $3Dmol.StateManager(trajectoryViewer);
  trajectoryControls.setModelTitle('Water · synthetic motion');
</script>
</body>
</html>
