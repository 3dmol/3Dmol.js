<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3Dmol.js UI example</title>
  <style>
    html, body { height: 100%; margin: 0; }
    .viewer_3Dmoljs { height: 100%; width: 100%; position: relative; }
  </style>
  <!-- The UI registers with the core library, so preserve this execution order. -->
  <script src="../../build/3Dmol.js" defer></script>
  <script src="../../build/3Dmol.ui.js" defer></script>
</head>

<body>
  <div class='viewer_3Dmoljs' data-pdb='2POR'
    data-backgroundcolor='0xffffff' data-style='stick' data-ui='true'></div>
</body>

</html>
