<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3Dmol.js Viewer</title>
    <link rel="stylesheet" href="viewer.css">
    <script defer src="build/3Dmol-min.js"></script>
    <script defer src="build/3Dmol.ui-min.js"></script>
    <script defer src="learning-environment/sessions.js"></script>
    <script defer src="viewer.js"></script>
</head>
<body>
    <main id="gldiv" aria-label="Molecular viewer"></main>
    <div class="viewer-actions">
        <button id="sessionbutton" type="button" title="Classroom session" aria-label="Classroom session">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3"></circle><path d="M5 21v-3a7 7 0 0 1 14 0v3M4 5a3 3 0 0 0 0 6M20 5a3 3 0 0 1 0 6M1 19v-2a6 6 0 0 1 3-5m19 7v-2a6 6 0 0 0-3-5"></path></svg>
        </button>
    </div>
    <div id="viewer-message" role="alert" hidden></div>
    <div id="sessionconnect" class="rightdialog" role="dialog" aria-label="Join or create a classroom session">
        <div class="session-heading">
            <div class="session-drag" data-session-drag tabindex="0" aria-label="Move classroom dialog" title="Drag to move; use arrow keys when focused">
                <span class="session-grip" aria-hidden="true"></span><span>Classroom</span>
            </div>
            <button id="sessionconnectclose" type="button" class="close" title="Close session dialog" aria-label="Close session dialog">×</button>
        </div>
        <div class="session-body">
            <label for="session_name_input">Session name</label>
            <div class="session-toolbar">
                <input type="text" size="12" id="session_name_input" autocomplete="off">
                <button id="sessionconnectbutton" type="button" disabled>Create</button>
            </div>
        </div>
    </div>
    <div id="sessioncontrol" class="rightdialog" role="region" aria-label="Classroom session controls">
        <div class="session-heading">
            <div class="session-drag" data-session-drag tabindex="0" aria-label="Move classroom controls" title="Drag to move; use arrow keys when focused">
                <span class="session-grip" aria-hidden="true"></span><span class="sessionname">Session</span>
            </div>
            <button id="sessiondestroy" type="button" class="close" title="End session" aria-label="End session">×</button>
        </div>
        <div class="session-body">
            <div class="session-toolbar">
                <button id="askbutton" type="button" class="session-primary">Query Atoms</button>
                <div id="sessioncontrolinfo" class="session-stats" aria-live="polite">
                    <span id="userinfo">Users: 0</span>
                    <span id="responseinfo"></span>
                </div>
                <button id="refreshresults" type="button" class="session-icon" title="Refresh responses" aria-label="Refresh responses">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8a8 8 0 1 0 1 8M19 3v5h-5"/></svg>
                </button>
            </div>
        </div>
    </div>
    <div id="sessionmonitor" class="rightdialog" role="region" aria-label="Classroom session">
        <div class="session-heading">
            <div class="session-drag" data-session-drag tabindex="0" aria-label="Move classroom status" title="Drag to move; use arrow keys when focused">
                <span class="session-grip" aria-hidden="true"></span><span class="sessionname">Session</span>
            </div>
            <button id="sessionleave" type="button" class="close" title="Leave session" aria-label="Leave session">×</button>
        </div>
        <div class="session-body"><span id="sessionmonitorinfo">Following instructor</span></div>
    </div>
    <div id="selectmessage" role="status">Select atom(s)</div>
</body>
</html>
