<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3Dmol.js Viewer</title>
    <link rel="stylesheet" href="viewer.css">
    <script defer src="build/3Dmol-min.js"></script>
    <script defer src="build/3Dmol.ui-min.js"></script>
    <script defer src="learning-environment/sessions.js"></script>
    <script defer src="viewer.js"></script>
</head>
<body>
    <main id="gldiv" aria-label="Molecular viewer"></main>
    <div class="viewer-actions">
        <button id="copy-link" type="button" title="Copy a link to this view" aria-label="Copy a link to this view">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 13 4-4M8 16l-1 1a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0m0 12a4 4 0 0 0 6 0l5-5a4 4 0 0 0-6-6l-1 1" transform="translate(1 0) scale(.9)"></path></svg>
        </button>
        <button id="sessionbutton" type="button" title="Classroom session" aria-label="Classroom session">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3"></circle><path d="M5 21v-3a7 7 0 0 1 14 0v3M4 5a3 3 0 0 0 0 6M20 5a3 3 0 0 1 0 6M1 19v-2a6 6 0 0 1 3-5m19 7v-2a6 6 0 0 0-3-5"></path></svg>
        </button>
    </div>
    <div id="viewer-message" role="alert" hidden></div>
    <div id="sessionconnect" class="rightdialog" role="dialog" aria-label="Join or create a classroom session">
        <div>
            <label for="session_name_input">Session</label>
            <input type="text" size="12" id="session_name_input" autocomplete="off">
            <button id="sessionconnectbutton" type="button" disabled>Create</button>
            <button id="sessionconnectclose" type="button" class="close" aria-label="Close session dialog">×</button>
        </div>
    </div>
    <div id="sessioncontrol" class="rightdialog" role="region" aria-label="Classroom session controls">
        <div class="sessionname">Session</div>
        <div>
            <button id="askbutton" type="button">Query Atoms</button>
            <div id="sessioncontrolinfo">
                <div id="userinfo">Users: 0</div>
                <div><span id="responseinfo"></span><button id="refreshresults" type="button" aria-label="Refresh responses">↻</button></div>
            </div>
            <button id="sessiondestroy" type="button" class="close" aria-label="End session">×</button>
        </div>
    </div>
    <div id="sessionmonitor" class="rightdialog" role="region" aria-label="Classroom session">
        <div class="sessionname">Session</div>
        <div><span id="sessionmonitorinfo"></span><button id="sessionleave" type="button" class="close" aria-label="Leave session">×</button></div>
    </div>
    <div id="selectmessage" role="status">Select atom(s)</div>
</body>
</html>
