name: Node.js Package

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 24

      - name: Create apparmor profile
        run: |
          cat > /tmp/chrome-dev-builds << EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile chrome.dev /@{HOME}/.cache/puppeteer/chrome/**/chrome flags=(unconfined) {
          userns,
          include if exists <local/chrome>
          }
          EOF
      - run: sudo cp /tmp/chrome-dev-builds /etc/apparmor.d/
      - name: Reload apparmor
        run: sudo service apparmor reload

      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - run: npm ci

      - run: npm publish --provenance
